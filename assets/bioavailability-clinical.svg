<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Milk thistle bioavailability comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="780"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f0f6f4"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b7454"/><stop offset="1" stop-color="#063f32"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#17233a" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="780" rx="34" fill="url(#bg)"/>
  <text x="600" y="78" text-anchor="middle" font-family="Inter, Arial" font-size="38" font-weight="900" fill="#17233a">The Bioavailability Problem</text>
  <text x="600" y="116" text-anchor="middle" font-family="Inter, Arial" font-size="17" font-weight="700" fill="#687487">Two labels can say “milk thistle” but perform very differently.</text>
  <g filter="url(#s)">
    <rect x="82" y="175" width="450" height="480" rx="30" fill="#fff" stroke="#dbe6e3"/>
    <text x="307" y="234" text-anchor="middle" font-family="Inter, Arial" font-size="28" font-weight="900" fill="#17233a">Generic Extract</text>
    <text x="307" y="264" text-anchor="middle" font-family="Inter, Arial" font-size="14" font-weight="800" fill="#758391">FAMILIAR NAME, UNCLEAR DELIVERY</text>
    <g transform="translate(174 315)">
      <rect x="0" y="0" width="265" height="34" rx="17" fill="#e8eef0"/>
      <rect x="0" y="0" width="92" height="34" rx="17" fill="#ce4e4a"/>
      <text x="132" y="70" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#687487">Lower usable support</text>
      <g fill="#ce4e4a" opacity=".55">
        <circle cx="34" cy="130" r="9"/><circle cx="88" cy="165" r="7"/><circle cx="145" cy="118" r="5"/><circle cx="196" cy="178" r="6"/><circle cx="238" cy="140" r="8"/>
      </g>
      <path d="M30 225c64-28 137-28 210 0" fill="none" stroke="#dbe6e3" stroke-width="8" stroke-linecap="round"/>
      <path d="M30 225c28-12 60-18 92-18" fill="none" stroke="#ce4e4a" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="307" y="594" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700" fill="#687487">Harder to judge if form and dose are vague.</text>
  </g>
  <g filter="url(#s)">
    <rect x="668" y="175" width="450" height="480" rx="30" fill="#fff" stroke="#cfe6dc"/>
    <text x="893" y="234" text-anchor="middle" font-family="Inter, Arial" font-size="28" font-weight="900" fill="#0b7454">Siliphos® Form</text>
    <text x="893" y="264" text-anchor="middle" font-family="Inter, Arial" font-size="14" font-weight="800" fill="#758391">NAMED FORM, BETTER DELIVERY SIGNAL</text>
    <g transform="translate(760 315)">
      <rect x="0" y="0" width="265" height="34" rx="17" fill="#e8eef0"/>
      <rect x="0" y="0" width="223" height="34" rx="17" fill="url(#g)"/>
      <text x="132" y="70" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#0b7454">Higher absorption confidence</text>
      <g fill="#0b7454" opacity=".55">
        <circle cx="34" cy="130" r="9"/><circle cx="79" cy="154" r="8"/><circle cx="124" cy="121" r="7"/><circle cx="170" cy="172" r="8"/><circle cx="216" cy="136" r="9"/><circle cx="242" cy="187" r="6"/>
      </g>
      <path d="M30 225c64-28 137-28 210 0" fill="none" stroke="#dbe6e3" stroke-width="8" stroke-linecap="round"/>
      <path d="M30 225c60-26 128-28 198-5" fill="none" stroke="#0b7454" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="893" y="594" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700" fill="#687487">Named forms make comparison easier and more trustworthy.</text>
  </g>
  <g>
    <circle cx="600" cy="416" r="42" fill="#fff" stroke="#dbe6e3" stroke-width="3"/>
    <path d="M585 416h30M606 405l13 11-13 11" fill="none" stroke="#0b7454" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>